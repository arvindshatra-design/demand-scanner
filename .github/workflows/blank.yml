name: scan
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/scan.yml']
  schedule:
    - cron: '0 6 * * *'
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: HN unmet demand scan
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.parse, urllib.request
          since = int(time.time()) - 30*86400
          qs = ["is there a tool", "is there an app", "looking for a tool", "alternative to", "I wish there was", "does anyone know a"]
          pat = re.compile(r"tool|app\b|software|alternative|library|platform|service|extension|plugin|wish|looking for|is there|anyone know", re.I)
          seen = {}
          for q in qs:
              p = urllib.parse.urlencode({"query": q, "tags": "ask_hn", "hitsPerPage": 30, "numericFilters": f"num_comments<=3,created_at_i>{since}"})
              try:
                  with urllib.request.urlopen("https://hn.algolia.com/api/v1/search?" + p, timeout=20) as r:
                      d = json.load(r)
                  for h in d["hits"]:
                      if pat.search(h.get("title") or ""):
                          seen[h["objectID"]] = h
              except Exception as e:
                  print("ERROR", q, e)
              time.sleep(1)
          rows = sorted(seen.values(), key=lambda h: -(h.get("points") or 0))
          print("unique matches:", len(rows))
          for h in rows[:25]:
              print(h.get("points"), h.get("num_comments"), h["title"], "https://news.ycombinator.com/item?id=" + h["objectID"])
          EOF
