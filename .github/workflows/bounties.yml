name: bounties
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/bounties.yml']
jobs:
  bounties:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Measure open bounties
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json, re, os, time, collections, urllib.parse, urllib.request
          from datetime import datetime, timezone
          H = {"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GH_TOKEN"], "User-Agent": "demand-scanner"}
          FARMS = ["ClankerNation/OpenAgents", "OphirPay/OphirPay", "UnsafeLabs/Bounty-Hunters", "SecureBananaLabs/bug-bounty", "relayhop/sn-monetization-runtime"]
          EX = " ".join("-repo:" + f for f in FARMS)
          def get(q, page):
              u = "https://api.github.com/search/issues?" + urllib.parse.urlencode({"q": q, "sort": "created", "order": "desc", "per_page": 100, "page": page})
              with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=30) as r:
                  return json.load(r), r.headers.get("x-ratelimit-remaining")
          items = {}
          jobs = [('label:"💎 Bounty" is:issue is:open ' + EX, p) for p in (1, 2, 3)] + [('label:bounty is:issue is:open ' + EX, 1)]
          for q, p in jobs:
              try:
                  d, rem = get(q, p)
              except Exception as e:
                  print("ERROR", p, e)
                  continue
              for it in d["items"]:
                  items.setdefault(it["id"], it)
              print(q[:32], "page", p, "| total after exclusions:", d["total_count"], "| fetched", len(d["items"]), "| rate remaining", rem)
              time.sleep(3)
          now = datetime.now(timezone.utc)
          rows = []
          for it in items.values():
              txt = it["title"] + " " + " ".join(l["name"] for l in it["labels"])
              m = re.search(r"\$\s?([\d,]+(?:\.\d+)?)\s?(k)?", txt, re.I)
              amt = float(m.group(1).replace(",", "")) * (1000 if m.group(2) else 1) if m else 0
              age = (now - datetime.fromisoformat(it["created_at"].replace("Z", "+00:00"))).days
              rows.append((amt, it["comments"], age, it["repository_url"].split("repos/")[1], it["title"][:50], it["html_url"]))
          cnt = collections.Counter(r[3] for r in rows)
          print("\nissues:", len(rows), "| repos:", len(cnt), "| with $ amount:", sum(r[0] > 0 for r in rows))
          print("top repos:", cnt.most_common(6))
          print("\namount(0=unknown) | comments | age_days | repo | title | url")
          for r in sorted(rows, key=lambda x: (x[1], -x[0]))[:40]:
              print(int(r[0]), r[1], r[2], r[3], r[4], r[5])
          EOF
