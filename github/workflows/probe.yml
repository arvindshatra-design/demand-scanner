name: probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Look at thread format
        run: |
          python3 - <<'EOF'
          import json, urllib.request
          u = "https://hn.algolia.com/api/v1/items/49521942"
          with urllib.request.urlopen(u, timeout=30) as r:
              d = json.load(r)
          kids = d.get("children", [])
          print("top-level comments:", len(kids))
          for k in kids[:15]:
              t = (k.get("text") or "").replace("\n", " ")
              print("-", t[:150])
          EOF
